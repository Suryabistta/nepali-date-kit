name: Release

# Push a tag like v1.0.1 (matching the Version header) to publish a release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches plugin version
        run: |
          VERSION=$(sed -n 's/^ \* Version: *//p' nepali-date-kit.php)
          STABLE=$(sed -n 's/^Stable tag: *//p' readme.txt)
          test "v$VERSION" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME != Version $VERSION"; exit 1; }
          test "$VERSION" = "$STABLE" || { echo "Stable tag $STABLE != Version $VERSION"; exit 1; }

      - name: Run tests
        run: php tests/run.php

      - name: Build ZIP
        run: sh bin/build-zip.sh

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "Nepali Date Kit ${GITHUB_REF_NAME#v}" --generate-notes

      # Runs only once the plugin is approved on WordPress.org and the
      # SVN_USERNAME / SVN_PASSWORD repository secrets are set.
      - name: Deploy to WordPress.org
        if: ${{ env.SVN_USERNAME != '' }}
        env:
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: nepali-date-kit
        uses: 10up/action-wordpress-plugin-deploy@stable
